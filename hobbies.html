        }
        .card {

            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 42px;
            margin-bottom: 20px;

        }
        .info-item {

            line-height: 2;
